name: Build VeraCrypt for macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew update
        brew install pkg-config nasm cmake

    - name: Download wxWidgets 3.2.5
      run: |
        cd /tmp
        curl -L -O https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.5/wxWidgets-3.2.5.tar.bz2
        tar xjf wxWidgets-3.2.5.tar.bz2

    - name: Build VeraCrypt
      run: |
        cd src
        chmod +x Build/build_veracrypt_macosx.sh
        ./Build/build_veracrypt_macosx.sh

    - name: Archive VeraCrypt.app
      if: success()
      run: |
        mkdir -p output
        cp -R src/Main/VeraCrypt.app output/

    - name: Upload VeraCrypt.app artifact
      uses: actions/upload-artifact@v4
      with:
        name: VeraCrypt-macOS-App
        path: output/VeraCrypt.app
